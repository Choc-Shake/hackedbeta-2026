<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrapMap Compass – demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #05140b; color: #e8ffe9; text-align: center;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 16px; overflow-x: hidden;
  }
  h1 { margin: 0 0 4px; font-size: 2.2rem; letter-spacing: .02em; }
  .sub { color: #8fbf98; margin: 0 0 20px; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 14px;
    padding: 14px 26px; font-size: 1.15rem; cursor: pointer;
  }
  .primary { background: #3ddc6b; color: #05140b; }
  .ghost { background: #12301c; color: #bfe8c6; font-size: .95rem; padding: 10px 16px; }
  .ghost.locked { background: #3ddc6b; color: #05140b; }
  .hidden { display: none !important; }

  /* ---------- Radar ---------- */
  #radar {
    position: relative; width: min(84vw, 62vh, 380px); aspect-ratio: 1; margin: 14px auto;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), transparent 40%),
      repeating-linear-gradient(0deg, transparent 0 11.5%, rgba(0,60,20,.55) 11.5% 12.5%),
      repeating-linear-gradient(90deg, transparent 0 11.5%, rgba(0,60,20,.55) 11.5% 12.5%),
      radial-gradient(circle, #5cf07e, #20a845 70%, #0f6b2a);
    border: 10px solid #1d3b25;
    box-shadow: 0 0 0 3px #3a6b47, 0 10px 40px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.45);
    overflow: hidden;
    transition: box-shadow .3s;
  }
  #radar.ahead { box-shadow: 0 0 0 3px #b6ffc6, 0 0 40px #3ddc6b, inset 0 0 40px rgba(0,0,0,.45); }
  /* rotating sweep line */
  #sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,.28), transparent 18%);
    animation: spin 3s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #aheadMark {
    position: absolute; left: 50%; top: 4px; transform: translateX(-50%);
    width: 0; height: 0; border: 9px solid transparent; border-bottom: 14px solid #e8ffe9;
    opacity: .85;
  }
  #accuracy {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px dashed rgba(255,255,255,.45);
    transform: translate(-50%, -50%); width: 0; height: 0;
  }
  .icon {
    position: absolute; left: 50%; top: 50%; line-height: 1;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
  }
  #you { font-size: 54px; z-index: 2; }
  #toilet { font-size: 44px; z-index: 3; }
  #toilet.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 12px #fff); } }

  #big { font-size: 2.6rem; font-weight: 800; color: #3ddc6b; margin-top: 4px; }
  #name { color: #bfe8c6; font-size: 1.05rem; min-height: 1.3em; }
  #hint { color: #ffd166; min-height: 1.3em; margin: 8px 0; max-width: 360px; font-size: .95rem; }
  #acc { color: #8fbf98; font-size: .85rem; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

  /* ---------- Arrival ---------- */
  #toilet.flush { animation: flush 1.5s ease-in forwards; }
  @keyframes flush {
    0%   { transform: translate(-50%, -50%) rotate(0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(1080deg) scale(0); opacity: 0; }
  }
  #arrived {
    position: fixed; inset: 0; background: rgba(5, 20, 11, .94);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    z-index: 10; animation: fadeIn .4s;
  }
  #arrived .emoji { font-size: 90px; }
  #arrived h2 { margin: 0; font-size: 2rem; }
  @keyframes fadeIn { from { opacity: 0; } }

  #pick { font: inherit; font-size: 1rem; padding: 10px 14px; border-radius: 12px; border: 0;
          background: #12301c; color: #e8ffe9; margin: 6px 0 2px; max-width: 90vw; }
  #aheadLabel { font-size: 12px; font-weight: 700; color: #bfe8c6; letter-spacing: .06em; margin: 8px 0 -6px; }
  #debug { margin: 12px auto 0; font: 11px ui-monospace, monospace; color: #8fbf98; white-space: pre-wrap; text-align: left; max-width: 92vw; }
  #compassScreen { width: 100%; }
  .card { max-width: 360px; margin: 0 auto; }
  .card p { color: #bfe8c6; line-height: 1.45; }
  .big2 { font-size: 3rem; font-weight: 800; color: #3ddc6b; margin: 6px 0; }
  .stack { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 14px; }
  .ghost.on { background: #ffd166; color: #05140b; }
</style>
</head>
<body>

  <!-- ===== 1. Start screen ===== -->
  <section id="startScreen">
    <h1>💩 CrapMap</h1>
    <p class="sub">Points you to the nearest washroom</p>
    <button id="start" class="primary">💩 Start</button>
  </section>

  <!-- ===== 2. Lock north screen (must be done before the radar) ===== -->
  <section id="lockScreen" class="hidden card">
    <h1>🧭 Lock north</h1>
    <p>Hold your phone <b>flat</b>, screen up. The compass gets thrown off by steel indoors,
       so lock it once, then the gyroscope keeps track of your turns.</p>
    <div>Compass says</div>
    <div class="big2" id="liveCompass">–</div>
    <div id="lockHint" style="color:#ffd166; min-height:1.3em"></div>
    <div class="stack">
      <button id="lockCompass" class="primary">Lock using compass<br><small>(near a window / outside)</small></button>
      <button id="lockManual" class="ghost">I'm pointing my phone north → set it</button>
    </div>
  </section>

  <!-- ===== 3. Radar screen ===== -->
  <section id="compassScreen" class="hidden">
    <select id="pick"></select>
    <div id="aheadLabel">LINE THE 🚽 UP HERE ▼</div>
    <div id="radar">
      <div id="sweep"></div>
      <div id="aheadMark"></div>
      <div id="accuracy"></div>
      <div id="you" class="icon">💩</div>
      <div id="toilet" class="icon">🚽</div>
    </div>
    <div id="big">–</div>
    <div id="name">Finding you…</div>
    <div id="acc"></div>
    <div id="hint"></div>
    <div class="row">
      <button id="relock" class="ghost">🧭 Re-lock north</button>
      <button id="freeze" class="ghost">📍 Freeze GPS</button>
      <button id="debugBtn" class="ghost">Numbers</button>
    </div>
    <div id="debug" class="hidden"></div>
  </section>

  <!-- ===== 4. Arrived overlay ===== -->
  <section id="arrived" class="hidden">
    <div class="emoji">🧻</div>
    <h2>You have arrived</h2>
    <div id="arrivedName" style="color:#bfe8c6"></div>
    <button id="again" class="primary">Find another</button>
  </section>

  <!-- Team files in the plan's load order (?v= stops the phone using an old cached copy) -->
  <script src="../js/state.js?v=5"></script>
  <script src="../js/washrooms.js?v=5"></script>
  <script src="../js/location.js?v=5"></script>
  <script src="../js/sensors.js?v=5"></script>
  <script src="../js/angle.js?v=5"></script>

  <script>
    // =================================================================
    // DEMO PAGE. Uses the team's files (state, washrooms, location,
    // sensors, angle). Stand-ins below cover what isn't in the repo yet.
    // =================================================================
    const $ = (id) => document.getElementById(id);
    const demoWrap360 = (a) => ((a % 360) + 360) % 360;
    const RADAR_RANGE_M = 60;       // accuracy circle scale: 60 m = edge of radar
    const STEP_LENGTH_M = 0.7;      // one walking step

    // ---------- Screens ----------
    function show(id) {
      for (const s of ['startScreen', 'lockScreen', 'compassScreen']) $(s).classList.add('hidden');
      $(id).classList.remove('hidden');
    }

    // ---------- Sensors: compass + gyro for both phones ----------
    // iPhone: sensors.js keeps sensorDebug.compass / sensorDebug.gyro up to date.
    // Android: Chrome gives the compass in 'deviceorientationabsolute' and the
    //          gyro in plain 'deviceorientation', read here.
    const isAndroid = 'ondeviceorientationabsolute' in window;   // iPhone Safari doesn't have it
    const android = { compass: null, gyro: null, compassEvents: 0, gyroEvents: 0 };
    let northOffset = null;   // set by Lock north: heading = gyro + northOffset

    function startAndroidSensors() {
      window.addEventListener('deviceorientationabsolute', (e) => {
        if (e.alpha === null) return;
        android.compassEvents++;
        android.compass = demoWrap360(360 - e.alpha);
        state.tilted = Math.abs(e.beta) > 35 || Math.abs(e.gamma) > 35;
      });
      window.addEventListener('deviceorientation', (e) => {
        if (e.alpha === null || e.absolute) return;   // only the gyro-based (relative) one
        android.gyroEvents++;
        android.gyro = demoWrap360(360 - e.alpha);
      });
      state.started = true;
    }

    const compassNow = () => (isAndroid ? android.compass : sensorDebug.compass);
    const gyroNow = () => (isAndroid ? android.gyro : sensorDebug.gyro);

    function lockNorthWith(direction) {   // direction = which way the phone points right now
      const gyro = gyroNow();
      if (gyro === null || direction === null) return false;
      northOffset = direction - gyro;
      return true;
    }

    function updateHeading() {
      const gyro = gyroNow();
      if (northOffset !== null && gyro !== null) {
        state.heading = demoWrap360(gyro + northOffset);
        state.locked = true;
      }
    }

    // ---------- Position: GPS + step counting ----------
    // location.js writes every raw GPS reading into state.lat/lon. Indoors those
    // jump 10-30 m and only arrive every few seconds, so on their own they can't
    // see you walk 10 m. So we keep our own position estimate (pos):
    //   * each STEP moves pos 0.7 m in the direction the phone faces
    //   * each GPS reading pulls pos toward it: a lot if accurate, a little if not
    let pos = null;                 // { lat, lon } — our best guess, written into state
    let gpsFrozen = false;          // true = ignore GPS, move by steps only
    const gps = { raw: null, at: 0, count: 0 };
    let steps = 0;

    function gpsWeight(accuracy) {  // ±10 m → 0.69, ±20 m → 0.36, ±35 m → 0.16, ±60 m → 0.06
      return 1 / (1 + ((accuracy || 30) / 15) ** 2);
    }

    function fusePosition() {
      if (state.lat === null) return;
      const isNewReading = !pos || state.lat !== pos.lat || state.lon !== pos.lon;
      if (isNewReading) {
        gps.raw = { lat: state.lat, lon: state.lon, acc: state.accuracy };
        gps.at = performance.now();
        gps.count++;
        if (!pos) pos = { lat: state.lat, lon: state.lon };      // first fix: start here
        else if (!gpsFrozen) {
          const k = gpsWeight(state.accuracy);
          pos.lat += (gps.raw.lat - pos.lat) * k;
          pos.lon += (gps.raw.lon - pos.lon) * k;
        }
      }
      state.lat = pos.lat; state.lon = pos.lon;
    }

    function onStep() {
      steps++;
      if (!pos || northOffset === null) return;   // need a position and a locked heading
      const h = state.heading * Math.PI / 180;
      pos.lat += (STEP_LENGTH_M * Math.cos(h)) / 111320;
      pos.lon += (STEP_LENGTH_M * Math.sin(h)) / (111320 * Math.cos(pos.lat * Math.PI / 180));
      state.lat = pos.lat; state.lon = pos.lon;
    }

    // Step detection: walking makes the phone bounce. Smooth the total acceleration
    // and count a step each time it rises above gravity + 1.4 (at most one per 0.3 s).
    let accSmooth = 9.8, stepArmed = true, lastStepAt = 0;
    function onMotion(e) {
      const a = e.accelerationIncludingGravity;
      if (!a || a.x === null) return;
      const mag = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
      accSmooth = accSmooth * 0.5 + mag * 0.5;
      const now = performance.now();
      if (stepArmed && accSmooth > 11.2 && now - lastStepAt > 300) {
        stepArmed = false; lastStepAt = now; onStep();
      } else if (accSmooth < 10.3) {
        stepArmed = true;
      }
    }

    // ---------- Distance stand-in (until js/distance.js exists) ----------
    function demoDistanceM(lat1, lon1, lat2, lon2) {   // haversine
      const R = 6371000, r = Math.PI / 180;
      const a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
        Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }
    let choice = 'auto';          // 'auto' = nearest, or an index into WASHROOMS
    let skipWashroom = null;      // set by "Find another"
    function demoUpdateDistance() {
      if (state.lat === null) return;
      let best = null, bestD = Infinity;
      if (choice !== 'auto') {
        best = WASHROOMS[choice];
        bestD = demoDistanceM(state.lat, state.lon, best.lat, best.lon);
      } else {
        for (const w of WASHROOMS) {
          if (w === skipWashroom && WASHROOMS.length > 1) continue;
          const d = demoDistanceM(state.lat, state.lon, w.lat, w.lon);
          if (d < bestD) { best = w; bestD = d; }
        }
        if (state.target && state.target !== best && state.target !== skipWashroom) {   // hysteresis
          const curD = demoDistanceM(state.lat, state.lon, state.target.lat, state.target.lon);
          if (curD - bestD < 10) { best = state.target; bestD = curD; }
        }
      }
      state.target = best;
      state.distance = bestD;
      if (bestD < Math.max(15, (state.accuracy || 0) * 0.8)) state.arrived = true;   // latched
    }

    // ---------- Buttons ----------
    $('start').addEventListener('click', async () => {
      await startSensors();               // iPhone permission (must be inside the tap)
      try {                               // iPhone also needs a separate OK for motion (steps)
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
          await DeviceMotionEvent.requestPermission();
      } catch (e) {}
      window.addEventListener('devicemotion', onMotion);
      if (isAndroid) startAndroidSensors();
      startLocation();
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
      show('lockScreen');
      requestAnimationFrame(loop);
    });

    $('lockCompass').addEventListener('click', () => {
      if (lockNorthWith(compassNow())) show('compassScreen');
      else $('lockHint').textContent = 'No compass/gyro readings yet. Hold the phone flat and wait a second.';
    });
    $('lockManual').addEventListener('click', () => {
      if (lockNorthWith(0)) show('compassScreen');
      else $('lockHint').textContent = 'No gyro readings yet. Hold the phone flat and wait a second.';
    });
    $('relock').addEventListener('click', () => show('lockScreen'));
    $('freeze').addEventListener('click', () => {
      gpsFrozen = !gpsFrozen;
      $('freeze').classList.toggle('on', gpsFrozen);
      $('freeze').textContent = gpsFrozen ? '📍 GPS off (steps only)' : '📍 Freeze GPS';
    });
    $('debugBtn').addEventListener('click', () => $('debug').classList.toggle('hidden'));

    const pick = $('pick');
    pick.innerHTML = '<option value="auto">🚽 Nearest washroom</option>' +
      WASHROOMS.map((w, i) => `<option value="${i}">${w.name}</option>`).join('');
    pick.addEventListener('change', () => {
      choice = pick.value; skipWashroom = null;
      state.target = null; state.arrived = false; shownArrival = false;
    });

    let shownArrival = false;
    $('again').addEventListener('click', () => {
      skipWashroom = state.target;
      choice = 'auto'; pick.value = 'auto';
      state.target = null; state.arrived = false; shownArrival = false;
      $('arrived').classList.add('hidden');
      $('toilet').classList.remove('flush');
    });

    // ---------- Every frame ----------
    const radar = $('radar'), toilet = $('toilet'), accuracyRing = $('accuracy');
    const f = (v, n = 0) => (v === null || v === undefined ? '–' : Number(v).toFixed(n));

    function loop() {
      updateHeading();
      fusePosition();
      if (typeof updateDistance === 'function' && choice === 'auto') updateDistance();
      else demoUpdateDistance();
      updateAngle();   // Angle (js/angle.js): sets state.bearing and state.relAngle

      // Lock screen: live compass
      $('liveCompass').textContent = compassNow() === null ? '–' : Math.round(compassNow()) + '°';

      // Radar: 🚽 on the rim at relAngle (0 = top = straight ahead)
      const R = radar.clientWidth / 2 - 30;
      if (state.target && state.distance !== null && !state.arrived) {
        const a = state.relAngle * Math.PI / 180;
        toilet.style.transform = `translate(-50%, -50%) translate(${R * Math.sin(a)}px, ${-R * Math.cos(a)}px)`;
        $('big').textContent = Math.round(state.distance) + ' m';
        $('name').textContent = state.target.name;
        const ahead = Math.abs(state.relAngle) < 15;
        radar.classList.toggle('ahead', ahead);
        toilet.classList.toggle('pulse', ahead);
      }
      if (state.accuracy !== null) {
        const d = 2 * R * Math.min(state.accuracy / RADAR_RANGE_M, 1);
        accuracyRing.style.width = accuracyRing.style.height = d + 'px';
        $('acc').textContent = '± ' + Math.round(state.accuracy) + ' m' + (gpsFrozen ? ' (frozen)' : '');
      }

      // Arrival
      if (state.arrived && !shownArrival) {
        shownArrival = true;
        toilet.style.transform = '';
        toilet.classList.add('flush');
        if (navigator.vibrate) navigator.vibrate([100, 50, 300]);
        setTimeout(() => {
          $('arrivedName').textContent = state.target ? state.target.name : '';
          $('arrived').classList.remove('hidden');
        }, 1500);
      }

      // Hints
      let hint = '';
      const noSensors = isAndroid ? android.compassEvents + android.gyroEvents === 0 : sensorDebug.compass === null;
      if (state.locationError === 'denied') hint = 'Location blocked: allow it in your settings.';
      else if (noSensors) hint = isAndroid
        ? 'No motion sensor data. Chrome: ⋮ → Settings → Site settings → Motion sensors → Allow, then reload.'
        : 'No compass data yet (iPhone: use Safari and allow Motion access).';
      else if (state.lat === null) hint = 'Finding you… (works best near a window)';
      else if (state.tilted) hint = 'Hold your phone flat';
      else if (gpsFrozen && Math.abs(state.relAngle) < 15) hint = 'Straight ahead. Walk! (GPS off: tracking your steps) 🏃';
      else if (Math.abs(state.relAngle) < 15) hint = 'Straight ahead. Walk! 🏃';
      else hint = state.relAngle > 0 ? 'Turn right ↻' : 'Turn left ↺';
      $('hint').textContent = hint;

      $('debug').textContent =
        `position ${f(state.lat, 6)}, ${f(state.lon, 6)}\n` +
        `GPS raw ${gps.raw ? f(gps.raw.lat, 6) + ', ' + f(gps.raw.lon, 6) : '–'}  ±${f(state.accuracy)} m  ` +
        `(${gps.count} readings, last ${gps.at ? ((performance.now() - gps.at) / 1000).toFixed(0) + ' s ago' : '–'})${gpsFrozen ? ' IGNORED' : ''}\n` +
        `steps ${steps}  (each moves you ${STEP_LENGTH_M} m the way you face)\n` +
        `compass ${f(compassNow())}°  gyro ${f(gyroNow())}°  offset ${f(northOffset)}°\n` +
        (isAndroid ? `readings: compass ${android.compassEvents}, gyro ${android.gyroEvents}\n` : '') +
        `heading ${f(state.heading)}°  bearing ${f(state.bearing)}°  relAngle ${f(state.relAngle)}°\n` +
        `distance ${f(state.distance)} m   distance.js: ${typeof updateDistance === 'function' ? 'team' : 'demo stand-in'}\n` +
        `🚽 moving while still? bearing changing → GPS (try Freeze GPS). heading changing → compass/gyro.`;

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
