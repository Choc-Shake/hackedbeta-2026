<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:black; color:white; font-size:24px; font-family:monospace; padding:20px">
  <button id="start" style="font-size:24px; padding:12px 24px">Start</button>
  <button id="lock" style="font-size:24px; padding:12px 24px">Lock north</button>
  <div id="out" style="white-space:pre">tap start</div>

<script src="../js/state.js?v=6"></script>
<script src="../js/sensors.js?v=6"></script>
<script>
  // Test page only: plays the role of the UI teammate's code.
  const out = document.getElementById('out');

  document.getElementById('start').addEventListener('click', async () => {
    const ok = await startSensors();
    if (!ok) { out.textContent = 'permission denied'; return; }

    // Redraw 10 times a second from shared state.
    setInterval(() => {
      const d = sensorDebug;
      out.textContent =
        'heading: ' + Math.round(state.heading) +
        (state.locked ? '  (locked)' : '  (compass ±' + Math.round(d.accuracy) + ')') +
        '\ncompass: ' + Math.round(d.compass) + '  gyro: ' + Math.round(d.gyro);
    }, 100);
  });

  document.getElementById('lock').addEventListener('click', () => {
    if (!lockNorth()) out.textContent = 'tap start first';
  });
</script>
</body>
</html>
