<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:black; color:white; font-size:24px; font-family:monospace; padding:20px">
  <button id="start" style="font-size:24px; padding:12px 24px">Start</button>
  <div id="out">tap start</div>

  <script>
    const out = document.getElementById('out');
    const startBtn = document.getElementById('start');

    startBtn.addEventListener('click', async () => {
      const answer = await DeviceOrientationEvent.requestPermission();
      out.textContent = 'permission: ' + answer;

      if (answer === 'granted') {
        window.addEventListener('deviceorientation', (e) => {
          out.textContent = 'heading: ' + Math.round(e.webkitCompassHeading);
        });
      }
    });
  </script>
</body>
</html>
